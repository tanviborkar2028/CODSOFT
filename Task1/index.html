<!DOCTYPE html>
<html>
<head>
<title>My Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">

    <input type="text" id="display" disabled aria-label="calculator display">

    <div class="row">
      <button class="red" onclick="clearDisplay()">AC</button>
      <button class="red" onclick="deleteLast()">DEL</button>
      <button class="teal" onclick="addToDisplay('.')">.</button>
      <button class="teal" onclick="addToDisplay('/')">/</button>
    </div>

    <div class="row">
      <button onclick="addToDisplay('7')">7</button>
      <button onclick="addToDisplay('8')">8</button>
      <button onclick="addToDisplay('9')">9</button>
      <button class="teal" onclick="addToDisplay('*')">*</button>
    </div>

    <div class="row">
      <button onclick="addToDisplay('4')">4</button>
      <button onclick="addToDisplay('5')">5</button>
      <button onclick="addToDisplay('6')">6</button>
      <button class="teal" onclick="addToDisplay('-')">-</button>
    </div>

    <div class="row">
      <button onclick="addToDisplay('1')">1</button>
      <button onclick="addToDisplay('2')">2</button>
      <button onclick="addToDisplay('3')">3</button>
      <button class="teal" onclick="addToDisplay('+')">+</button>
    </div>

    <div class="row">
      <button onclick="addToDisplay('00')">00</button>
      <button onclick="addToDisplay('0')">0</button>
      <button class="teal wide" onclick="calculate()">=</button>
    </div>

  </div>

<script src="script.js"></script>

</body>
</html>
